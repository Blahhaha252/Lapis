name: Lapis unified tests
on:
  push:
    branches: [main, unified-hls-gpt6]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q main.py unified.py tests/test_unified.py tests/test_unified_integration.py
      - run: python -m pytest -q tests/test_unified.py tests/test_unified_integration.py
